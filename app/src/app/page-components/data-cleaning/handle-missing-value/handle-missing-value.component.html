<div class="container-fluid py-4">
    <div class="row">
        <div class="col-lg-10 mx-auto">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h4 class="card-title mb-1">
                        <i class="bi bi-funnel me-2 text-info"></i>Handle Missing Values
                    </h4>
                    <p class="text-muted small mb-4">
                        Pick a dataset, then clean one column at a time by choosing a replacement strategy.
                    </p>

                    <!-- Step 0: Dataset selection -->
                    <div class="step-block">
                        <div class="step-label">
                            <span>Select a dataset <span class="text-danger">*</span></span>
                        </div>
                        <app-dataset-selection (datasetChange)="OnDatasetChange($event)"></app-dataset-selection>
                    </div>

                    <!-- Step 1: Column + strategy -->
                    <div class="step-block mt-4" *ngIf="SelectedDataset">
                        <div class="step-label">
                            <span>Pick a column and its replacement strategy</span>
                        </div>

                        <div class="d-flex align-items-center justify-content-center py-4" *ngIf="LoadingColumns">
                            <mat-progress-spinner mode="indeterminate" diameter="28"></mat-progress-spinner>
                        </div>

                        <ng-container *ngIf="!LoadingColumns">
                            <p class="text-muted small mb-0" *ngIf="NullableColumns.length === 0">
                                This dataset has no nullable columns.
                            </p>

                            <div class="row g-3" *ngIf="NullableColumns.length > 0">
                                <div class="col-md-6">
                                    <label class="field-label">Column <span class="text-danger">*</span></label>
                                    <app-single-selection-dropdown [options]="ColumnOptions"
                                        [selectedItem]="SelectedColumn" placeholder="Select column"
                                        (selectionChange)="OnColumnChange($event)">
                                    </app-single-selection-dropdown>
                                </div>

                                <div class="col-md-6" *ngIf="SelectedColumn !== null">
                                    <label class="field-label">Replacement strategy <span
                                            class="text-danger">*</span></label>
                                    <app-single-selection-dropdown [options]="StrategyOptions"
                                        [selectedItem]="SelectedStrategy" placeholder="Select strategy"
                                        (selectionChange)="OnStrategyChange($event)">
                                    </app-single-selection-dropdown>
                                </div>

                                <div class="col-12" *ngIf="IsConstantStrategy && SelectedColumn !== null">
                                    <label class="field-label">
                                        Constant value <span class="text-danger">*</span>
                                        <span class="field-hint" *ngIf="SelectedColumnTypeLabel">
                                            &mdash; expected type: {{ SelectedColumnTypeLabel }}
                                        </span>
                                    </label>
                                    <input type="text" class="form-control constant-value-input"
                                        [(ngModel)]="ConstantValue" name="constantValue"
                                        placeholder="Enter the value that will replace every null cell"
                                        autocomplete="off" />
                                </div>
                            </div>
                        </ng-container>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

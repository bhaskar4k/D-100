<div class="container-fluid py-4">
    <div class="row">
        <div class="col-lg-10 mx-auto">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h4 class="card-title mb-1">
                        <i class="bi bi-funnel me-2 text-info"></i>Handle Missing Values
                    </h4>
                    <p class="text-muted small mb-4">
                        Pick a dataset, then choose how to handle missing values for each nullable column.
                    </p>

                    <!-- Step 0: Dataset selection -->
                    <div class="step-block mb-4">
                        <div class="step-label">
                            <span>Select a dataset</span>
                        </div>
                        <app-dataset-selection (datasetChange)="OnDatasetChange($event)"></app-dataset-selection>
                    </div>

                    <!-- Step 1: Nullable columns -->
                    <div class="step-block" *ngIf="SelectedDataset">
                        <div class="step-label">
                            <span>Choose a strategy for each nullable column</span>
                        </div>

                        <div class="d-flex align-items-center justify-content-center py-4" *ngIf="LoadingColumns">
                            <mat-progress-spinner mode="indeterminate" diameter="28"></mat-progress-spinner>
                        </div>

                        <ng-container *ngIf="!LoadingColumns">
                            <p class="text-muted small mb-0" *ngIf="NullableColumns.length === 0">
                                This dataset has no nullable columns.
                            </p>

                            <div class="row g-3" *ngIf="NullableColumns.length > 0">
                                <div class="col-md-6 col-lg-4" *ngFor="let row of NullableColumns">
                                    <div class="column-card">
                                        <div class="column-head">
                                            <span class="column-name" [title]="row.column.columnName">
                                                {{ row.column.columnName }}
                                            </span>
                                            <span class="column-type">{{ GetTypeLabel(row.column.type) }}</span>
                                        </div>
                                        <app-single-selection-dropdown [options]="row.options"
                                            [selectedItem]="row.selected" placeholder="Select strategy"
                                            (selectionChange)="OnColumnStrategyChange(row, $event)">
                                        </app-single-selection-dropdown>
                                    </div>
                                </div>
                            </div>
                        </ng-container>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

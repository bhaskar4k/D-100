<!-- Empty State (shows when no folders exist) -->
<div *ngIf="!AllFolder.HasFolder" class="empty-folder-state text-center p-5 my-4 rounded-3">
    <div class="empty-icon-wrapper mx-auto mb-3 d-flex align-items-center justify-content-center rounded-circle">
        <i class="bi bi-folder2-open fs-1 text-muted"></i>
    </div>
    <h5 class="text-light fw-semibold mb-1">No Folders Found</h5>
    <p class="text-secondary fs-7 mb-0">There are no folders to display in this location right now.</p>
</div>

<!-- Folder List -->
<mat-expansion-panel *ngIf="AllFolder.HasFolder" class="drive-panel" [expanded]="MatExpansionState">

    <mat-expansion-panel-header>
        <mat-panel-title>
            <i class="bi bi-folder me-2 fs-4"></i>
            Folders ({{ AllFolder.FolderCount }})
        </mat-panel-title>
    </mat-expansion-panel-header>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-2 row-cols-lg-4 g-3">
        <div class="col" *ngFor="let folder of AllFolder.FoldersList">
            <app-folder-card [FolderInfo]="folder" [FolderRoutingPageName]="FolderRoutingPageName"
                (UpdatedFolder)="OnUpdateAnyFolder($event)"
                (DeletedFolder)="OnDeleteAnyFolder($event)"></app-folder-card>
        </div>
    </div>

</mat-expansion-panel>

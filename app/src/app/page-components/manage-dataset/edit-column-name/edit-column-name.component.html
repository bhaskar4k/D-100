<div class="card shadow border rounded-3 border-secondary-subtle p-0 overflow-hidden mx-auto text-body bg-body"
    data-bs-theme="dark" style="width: 520px; max-width: 100%;">

    <h2 class="card-title h5 border-bottom border-secondary-subtle m-0 p-3 bg-body-tertiary fw-bold rounded-top-3">
        <span class="text-primary">
            <i class="bi bi-pencil-square me-2"></i>Edit Column Name
        </span>
    </h2>

    <div class="card-body p-4">
        <label class="form-label small text-muted mb-2" for="columnNameInput">Column name</label>

        <input #nameInput id="columnNameInput" type="text" class="form-control" autocomplete="off"
            [maxlength]="MaxLength" [(ngModel)]="NewName" (keydown.enter)="OnSave()" (keydown.escape)="OnCancel()" />

        <div class="d-flex justify-content-between mt-2 small">
            @if (HasInvalidChar) {
            <span class="text-danger">
                <i class="bi bi-exclamation-triangle-fill me-1"></i>
                Cannot contain control characters.
            </span>
            } @else {
            <span class="text-muted">Pick a name the downstream consumers will see.</span>
            }
            <span class="text-muted">{{ Trimmed.length }} / {{ MaxLength }}</span>
        </div>
    </div>

    <div
        class="border-top border-secondary-subtle bg-body-tertiary p-3 m-0 d-flex justify-content-end gap-2 rounded-bottom-3">
        <button type="button" class="btn btn-sm btn-secondary" (click)="OnCancel()">Cancel</button>
        <button type="button" class="btn btn-sm btn-primary" [disabled]="!IsValid" (click)="OnSave()">
            <i class="bi bi-check2 me-1"></i>Save
        </button>
    </div>
</div>

<div class="page-loader" *ngIf="MatProgressBar">
    <mat-spinner diameter="50"></mat-spinner>
</div>

<div class="card shadow-sm m-3 p-3">
    <div class="app-page-header">
        <div>
            <h4 class="app-page-title">
                <i class="bi bi-person-plus-fill me-2 text-primary"></i>
                Register
            </h4>
            <small class="auth-subtitle">Register a new account</small>
        </div>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="OnSubmit()" autocomplete="off">
        <div class="row m-0">
            <div class="col-12 col-md-6 mt-3 p-0 pe-md-2">
                <label class="form-label">Name<span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="name" placeholder="Enter your name"
                    autocomplete="off">
            </div>

            <div class="col-12 col-md-6 mt-3 p-0 ps-md-2">
                <label class="form-label">Email<span class="text-danger">*</span></label>
                <input type="email" class="form-control" formControlName="email" placeholder="Enter your email"
                    autocomplete="off">
            </div>

            <div class="col-12 col-md-6 mt-3 p-0 pe-md-2">
                <label class="form-label">Phone<span class="text-danger">*</span></label>
                <input type="tel" class="form-control" formControlName="phone" placeholder="Enter phone number"
                    autocomplete="off">
            </div>

            <div class="col-12 col-md-6 mt-3 p-0 ps-md-2">
                <label class="form-label">Password<span class="text-danger">*</span></label>
                <input type="password" class="form-control" formControlName="password" placeholder="Enter password"
                    autocomplete="new-password">
            </div>

            <div class="col-12 col-md-6 mt-3 p-0 pe-md-2">
                <label class="form-label">Confirm Password<span class="text-danger">*</span></label>
                <input type="password" class="form-control" formControlName="confirmPassword"
                    placeholder="Confirm password" autocomplete="new-password">
            </div>

            <div class="col-12 mt-4 p-0">
                <div class="d-flex justify-content-end gap-2">
                    <button type="button" class="btn btn-sm btn-outline-secondary" (click)="OnReset()">Reset</button>
                    <button type="submit" class="btn btn-sm btn-primary">
                        <i class="bi bi-person-plus-fill me-1"></i> Register
                    </button>
                </div>
            </div>
        </div>
    </form>
</div>

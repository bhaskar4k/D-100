<div class="page-loader" *ngIf="IsMatProgressBarVisible()">
    <mat-spinner diameter="50"></mat-spinner>
</div>

<div class="container-fluid py-3">
    <!-- Header -->
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">

        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="overflow-auto">
            <ol class="breadcrumb mb-0 flex-nowrap">
                <div class="d-flex align-items-center">
                    <h4 class="pt-1"><i
                            class="bi bi-star-fill me-1 favourite_icon_color"></i>Favourite&nbsp;&nbsp;&nbsp;</h4>
                </div>
            </ol>
        </nav>

        <div></div>
    </div>

    <hr>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-2 row-cols-lg-4 g-3">
        <div class="col" *ngFor="let file of AllFile.FilesList">
            <app-file-card [FileInfo]="file" (UpdatedFile)="OnUpdateAnyFile($event)"
                (DeletedFile)="OnDeleteAnyFile($event)">
            </app-file-card>
        </div>
    </div>
</div>

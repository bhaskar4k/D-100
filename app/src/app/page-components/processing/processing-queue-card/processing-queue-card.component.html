<div class="queue-card" [attr.data-level]="CapacityLevel">
    <div class="queue-card-glow"></div>

    <div class="queue-card-head">
        <div class="queue-card-head-text">
            <div class="queue-card-label">
                <i class="bi bi-hdd-stack"></i>
                <span>Queue</span>
            </div>
            <h5 class="queue-name">{{ queue.displayName }}</h5>
        </div>

        <span class="queue-cap-badge" matTooltip="Max concurrent jobs" matTooltipPosition="above">
            <i class="bi bi-lightning-charge-fill"></i>
            <span>{{ queue.maxParallel }}</span>
        </span>
    </div>

    <div class="queue-stats">
        <div class="queue-stat queue-stat--queued">
            <div class="queue-stat-icon">
                <i class="bi bi-hourglass-split"></i>
            </div>
            <div class="queue-stat-body">
                <div class="queue-stat-label">In queue</div>
                <div class="queue-stat-value">{{ queue.inQueue }}</div>
                <div class="queue-stat-hint">waiting to be picked</div>
            </div>
        </div>

        <div class="queue-stat queue-stat--processing">
            <div class="queue-stat-icon">
                <i class="bi bi-cpu-fill"></i>
            </div>
            <div class="queue-stat-body">
                <div class="queue-stat-label">Processing</div>
                <div class="queue-stat-value">
                    {{ queue.processing }}
                    <span class="queue-stat-cap">/ {{ queue.maxParallel }}</span>
                </div>
                <div class="queue-stat-hint">currently running</div>
            </div>
        </div>
    </div>

    <div class="queue-capacity">
        <div class="queue-capacity-head">
            <span class="queue-capacity-label">Capacity</span>
            <span class="queue-capacity-value">{{ Utilization }}%</span>
        </div>
        <div class="queue-capacity-track">
            <div class="queue-capacity-fill" [style.width.%]="Utilization"></div>
        </div>
    </div>
</div>

<div class="card h-100 border-0 shadow-sm dark-file-card position-relative" [class.menu-open]="ShowMore">

    <div class="card-body d-flex align-items-center p-3">
        <div class="file-icon-wrapper me-3 d-flex align-items-center justify-content-center rounded-3 p-2">
            <i [class]="'bi fs-3 ' + GetFileIcon(File.ContentType).icon + ' ' + GetFileIcon(File.ContentType).color">
            </i>
        </div>

        <div class="text-truncate flex-grow-1">
            <h6 class="m-0 text-truncate fw-semibold text-light">{{ File.OriginalName }}</h6>
            <small class="text-muted">Uploaded {{ File.UploadedAgo }}</small>
        </div>

        <div class="position-relative">
            <i class="bi bi-three-dots-vertical fs-6 file-view-more cursor_pointer" (click)="ViewMoreInFile($event)">
            </i>

            <app-file-properties [ShowMore]="ShowMore" [FileInfo]="File" (UpdatedFile)="OnUpdateAnyFile($event)"
                (DeletedFile)="OnDeleteAnyFile($event)">
            </app-file-properties>
        </div>
    </div>
</div>

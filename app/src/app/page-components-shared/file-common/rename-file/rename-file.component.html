<div class="page-loader" *ngIf="MatProgressBar">
    <mat-spinner diameter="50"></mat-spinner>
</div>

<div class="p-3">
    <div class="card shadow-lg">

        <div class="card-body p-3 p-lg-3">

            <h2 class="text-center mb-4">
                Rename
            </h2>

            <div class="alert alert-info mb-4">
                <h5 class="alert-heading">
                    Before you Rename
                </h5>

                <ul class="mb-0">
                    <li>File names must be unique within the current location.</li>
                    <li>You can rename the file later if needed.</li>
                </ul>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">
                    File Name
                </label>

                <input type="text" class="form-control input_border" [(ngModel)]="File.OriginalName"
                    placeholder="Enter folder name">
            </div>

        </div>

        <div class="d-flex justify-content-end gap-2 px-3 pb-3">
            <button class="btn btn-secondary" (click)="close()">
                Close
            </button>

            <button class="btn btn-primary" [disabled]="isSaveDisabled()" (click)="save()">
                Rename
            </button>
        </div>

    </div>
</div>

<mat-form-field appearance="outline" class="single-select-field w-100" subscriptSizing="dynamic">
    <mat-select [(value)]="selectedValue" (selectionChange)="onValueChange($event.value)" [placeholder]="placeholder"
        panelClass="single-select-panel" disableOptionCentering hideSingleSelectionIndicator>
        <mat-option *ngFor="let opt of options" [value]="opt.id">
            {{ opt.text }}
        </mat-option>
    </mat-select>
</mat-form-field>

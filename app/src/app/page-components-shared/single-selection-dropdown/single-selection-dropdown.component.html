<div class="mb-3">
    <label class="form-label mb-1">{{ placeholder }}</label>

    <mat-select [(value)]="selectedValue" (selectionChange)="onValueChange($event.value)" [placeholder]="placeholder"
        class="custom-mat-select border rounded-2 p-2">
        <mat-option *ngFor="let opt of options" [value]="opt.id">
            {{ opt.text }}
        </mat-option>
    </mat-select>
</div>

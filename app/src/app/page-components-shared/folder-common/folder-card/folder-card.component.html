<div class="card h-100 border-0 shadow-sm dark-folder-card position-relative cursor_pointer"
    [class.menu-open]="ShowMore" (click)="NavigateToFolder()">

    <div class="card-body d-flex align-items-center p-3">
        <!-- Glowing dark icon badge -->
        <div class="icon-wrapper me-3 d-flex align-items-center justify-content-center rounded-3 p-2">
            <i class="bi bi-folder-fill fs-3 text-warning"></i>
        </div>

        <!-- Text content -->
        <div class="text-truncate flex-grow-1">
            <h6 class="m-0 text-truncate fw-semibold text-light folder-name">
                {{ Folder.FolderName }}
            </h6>

            <small class="text-muted">{{Folder.CreatedAt}}</small>
        </div>

        <div class="position-relative">
            <i class="bi bi-three-dots-vertical fs-6 folder-view-more cursor_pointer"
                (click)="ViewMoreInFolder($event)">
            </i>

            <app-folder-properties [ShowMore]="ShowMore" [FolderInfo]="Folder"
                (UpdatedFolder)="OnUpdateAnyFolder($event)" (DeletedFolder)="OnDeleteAnyFolder($event)">
            </app-folder-properties>
        </div>
    </div>
</div>

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyd-100"
version = "0.1.0"
description = "Python functions for the D-100 API, installed into site-packages and called from Node."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "polars>=2.0",
    "fastexcel>=0.21",   # lets polars read .xlsx / .xls
    "xlsxwriter>=3.2",   # lets polars write .xlsx (download feature)
]

[tool.setuptools.packages.find]
where = ["src"]
